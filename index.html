<script>

const API="https://script.google.com/macros/s/AKfycbyCONTH6eP7YKBnfE5_zkA8J_tlfyECY4f6H9Jcwd6QKn0oF9fYJCyuxVKbIvwm2Oiq5A/exec";

let buffer="";
let timeout=null;
let bloqueado=false;

document.addEventListener("keydown",function(e){

if(timeout){
clearTimeout(timeout);
}

if(e.key==="Enter"){

if(bloqueado){
buffer="";
return;
}

if(buffer.length>5){

bloqueado=true;

procesar(buffer);

}

buffer="";
return;

}

buffer+=e.key;

timeout=setTimeout(()=>{
buffer="";
},200);

});


function restaurar(){

bloqueado=false;

document.getElementById("resultado").innerHTML=`
<div class="srch">
Escanee su código
</div>
`;

}


function procesar(codigo){

document.getElementById("resultado").innerHTML=
"<div class='srch'>⏳ AGUARDE...<br><br>CONSULTANDO PRODUCTO</div>";

fetch(
API +
"?codigo=" +
encodeURIComponent(codigo)
)

.then(r=>r.text())

.then(txt=>{

let data;

try{

console.log("RESPUESTA:",txt);

data=JSON.parse(txt);

}catch(err){

console.log("ERROR:",err);

mostrarError(
"Error lectura<br><br>" +
(err.message || "")
);

setTimeout(
restaurar,
3000
);

return;

}


if(data.ok){

document.getElementById("resultado").innerHTML=`

<div class="barcode">
${codigo}
</div>

<div class="msg">
${data.nombre || ""}
</div>

<div class="small">
Código:
${data.codigo || ""}
</div>

<div class="small">
${data.categoria || ""}
</div>

${data.peso!==null && data.peso!==undefined ? `

<div class="small">
Peso:
${Number(data.peso).toFixed(3)}
Kg
</div>

<div class="small">
Precio x Kg:
$ ${Number(
data.precio || 0
).toLocaleString(
'es-AR',
{
minimumFractionDigits:2
}
)}
</div>

`:``}

<div class="precio">

$ ${Number(
data.precioFinal ??
data.precio ??
0
).toLocaleString(
'es-AR',
{
minimumFractionDigits:2
}
)}

</div>

`;

setTimeout(
restaurar,
6500
);

}else{

mostrarError(
"LO SENTIMOS<br><br>⚠ PRODUCTO NO ENCONTRADO<br><br>CONSULTE EN RECEPCIÓN"
);

setTimeout(
restaurar,
6500
);

}

})

.catch(err=>{

console.log(err);

mostrarError(
"Error de conexión"
);

setTimeout(
restaurar,
3000
);

});

}


function mostrarError(msg){

document.getElementById("resultado").innerHTML=`
<div class="srch">
${msg}
</div>
`;

}

</script>
